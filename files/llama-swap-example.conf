healthCheckTimeout: 600
logLevel: info
logToStdout: "proxy"
startPort: 10001
defaultTTL: 600

# Reusable macro for the docker run prefix (llama.cpp CUDA)
macros:
  llama-docker: |
    docker run
      --name ${MODEL_ID}
      --init
      --rm
      --gpus all
      -p ${PORT}:8080
      -v /mnt/nvme/models:/models
      ghcr.io/ggml-org/llama.cpp:server-cuda13
  sd-docker: |
    docker run
      --name ${MODEL_ID}
      --init
      --rm
      --gpus all
      --entrypoint /sd-server
      -p ${PORT}:8080
      -v /mnt/nvme/models:/models
      ghcr.io/leejet/stable-diffusion.cpp:master-cuda-spark

models:
  qwen3.6-35b-a3b-uncensored:
    cmd: |
      ${llama-docker}
        -m /models/Qwen3.6-35B-A3B/Huihui-Qwen3.6-35B-A3B-abliterated-ggml-model-Q6_K.gguf
        --alias "qwen3-35b-a3b"
        --port 8080
        --host 0.0.0.0
        --no-ui
        -ngl 999
        --cache-type-k q8_0 
        --cache-type-v q8_0
        -c 262144
        -np 1
        --spec-type draft-mtp
        --spec-draft-n-max 6
        --flash-attn on
        --mmproj /models/Qwen3.6-35B-A3B/Huihui.mmproj-model-f16.gguf
        --load-mode none
        --kv-unified
        -b 4096 -ub 4096
        --cache-reuse 256
        -t 16 -tb 16
        --presence-penalty 1.5 --min_p 0 --top_p 0.95 --top_k 20 --temperature 1.0
        --jinja
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    ttl: 600
    checkEndpoint: /health

  qwen3.8-flash-next:
    cmd: |
      ${llama-docker}
        -m /models/Qwen3.8-Flash-Next/Qwen3.8-Flash-Next-Uncensored.IQ4_XS.gguf
        --alias "qwen3.8-flash-next"
        --port 8080
        --host 0.0.0.0
        --no-ui
        -ngl 999
        --cache-type-k q8_0 
        --cache-type-v q8_0
        -c 262144
        -np 1
        --flash-attn on
        --mmproj /models/Qwen3.8-Flash-Next/mmproj-BF16.gguf
        --load-mode none
        --kv-unified
        -b 4096 -ub 4096
        --cache-reuse 256
        -t 16 -tb 16
        --no-warmup
        --repeat_penalty 1.00 --top_p 0.95 --top_k 20 --min-p 0.0 --presence-penalty 0.0 --temperature 1.0
        --reasoning-budget 4096
        --reasoning-budget-message "I have reached my reasoning budget. I will now provide my final answer or take the most appropriate action based on my analysis so far."
        --chat-template-kwargs '{"reasoning_effort":"medium"}'
        --jinja
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    ttl: 1800
    checkEndpoint: /health

  qwen3.8-27b:
    cmd: |
      ${llama-docker}
        -m /models/Qwen3.8-27B-TTURBO-MTP/Qwen3.8-27B-TTURBO-Fable-C-Fusion-709-L-Uncen-NM-DAU-NEO-MTP-Q4_K_M.gguf
        --alias "qwen3.8-27b"
        --port 8080
        --host 0.0.0.0
        --no-ui
        -ngl 999
        --cache-type-k q8_0
        --cache-type-v q8_0
        -c 262144
        -np 2
        --spec-type draft-mtp
        --spec-draft-n-max 2
        --flash-attn on
        --mmproj /models/Qwen3.8-27B-TTURBO-MTP/mmproj-BF16.gguf
        --load-mode none
        --kv-unified
        -b 4096 -ub 4096
        --cache-reuse 256
        -t 16 -tb 16
        --repeat_penalty 1.00 --top_p 0.95 --top_k 20 --min-p 0.0 --presence-penalty 0.0 --temperature 1.0
        --reasoning-budget 8192
        --reasoning-budget-message "I have reached my reasoning budget. I will now provide my final answer or take the most appropriate action based on my analysis so far."
        --chat-template-kwargs '{"reasoning_effort":"xhigh"}'
        --jinja
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    ttl: 1800
    checkEndpoint: /health

  glm-4.7-flash-30b:
    cmd: |
      ${llama-docker}
        -m /models/GLM-4.7-Flash-30B/glm-4.7-flash-nvfp4.gguf
        --alias "glm-4.7-flash-30b"
        --port 8080
        --host 0.0.0.0
        --no-ui
        -ngl 999
        --cache-type-k q8_0 
        --cache-type-v q8_0
        -c 196000
        -np 6
        --flash-attn on
        --load-mode none
        --kv-unified
        -b 4096 -ub 4096
        --cache-reuse 256
        -t 16 -tb 16
        --min_p 0.01 --top_p 1.0 --top_k 64 --temperature 0.7
        --jinja
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    ttl: 600
    checkEndpoint: /health

  flux.2-klein-9b:
    cmd: |
      ${sd-docker} \
        --listen-ip 0.0.0.0 \
        --listen-port 8080 \
        --diffusion-model /models/Flux.2-klein-9B/flux-2-klein-9b-Q8_0.gguf \
        --vae /models/Flux.2-klein-9B/diffusion_pytorch_model.safetensors \
        --llm /models/Flux.2-klein-9B/Qwen3-8B-Q4_K_M.gguf \
        --fa \
        --diffusion-fa \
        --cfg-scale 1.0 \
        --steps 8 \
        --sampling-method euler
    proxy: http://127.0.0.1:${PORT}
    ttl: 120
    checkEndpoint: /

  krea2:
    cmd: |
      ${sd-docker} \
        --listen-ip 0.0.0.0 \
        --listen-port 8080 \
        --diffusion-model /models/Krea2/krea2_turbo-Q8_0.gguf \
        --vae /models/Krea2/wan_2.1_vae.safetensors \
        --llm /models/Krea2/Qwen3VL-4B-Instruct-Q4_K_M.gguf \
        --fa \
        --diffusion-fa \
        --cfg-scale 1.0 \
        --steps 12 \
        --sampling-method euler_cfg_pp
    proxy: http://127.0.0.1:${PORT}
    ttl: 120
    checkEndpoint: /

  ideogram4:
    cmd: |
      ${sd-docker} \
        --listen-ip 0.0.0.0 \
        --listen-port 8080 \
        --diffusion-model /models/Ideogram4/ideogram4-cond-Q8_0.gguf \
        --uncond-diffusion-model /models/Ideogram4/ideogram4_unconditional-Q8_0.gguf \
        --vae /models/Ideogram4/flux2-vae.safetensors \
        --llm /models/Ideogram4/Qwen3-VL-8B-Q4_K_M.gguf \
        --fa \
        --diffusion-fa \
        --cfg-scale 1.0 \
        --steps 12 \
        --sampling-method euler_cfg_pp
    proxy: http://127.0.0.1:${PORT}
    ttl: 120
    checkEndpoint: /

groups:
  gpu-heavy:
    swap: true
    exclusive: true
    members:
      - qwen3.8-flash-next

  gpu-mid:
    swap: false
    members:
      - qwen3.6-35b-a3b-uncensored
      - qwen3.8-27b
      - glm-4.7-flash-30b
      - krea2
      - flux.2-klein-9b
      - z-turbo
      - ideogram4
